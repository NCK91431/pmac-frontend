# =============================================================
# Nginx 配置模板
# 使用官方 nginx 镜像的模板机制渲染：启动时只替换容器环境变量
# （如 $BACKEND_UPSTREAM），nginx 自身变量（$host、$uri 等）保持不变。
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 压缩 ----
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # ---- 后端 API 反向代理 ----
    # $BACKEND_UPSTREAM 由运行时环境变量注入（默认 http://backend:3001）
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;    # 算法计算/大文件下载较慢
        client_max_body_size 100m;  # 允许上传较大 Excel
    }

    # 健康检查
    location = /health {
        proxy_pass ${BACKEND_UPSTREAM}/health;
    }

    # ---- 静态资源缓存（带 hash 的文件名） ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA 前端路由 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
